<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Code Interview Quest</title>
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#07090e" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/retro.css" />
  <script>
    // Aplica o tema salvo antes da primeira pintura (a lógica completa está em js/core/theme.js).
    (function () {
      try {
        var s = (JSON.parse(localStorage.getItem('ciq.progress.v1')) || {}).settings || {};
        var root = document.documentElement;
        root.dataset.theme = s.theme === 'retro' ? 'retro' : 'moderno';
        root.dataset.palette = s.palette || 'synthwave';
        root.dataset.crt = s.crt === false ? 'off' : 'on';
        if (s.theme === 'retro') {
          var link = document.createElement('link');
          link.id = 'retro-fonts';
          link.rel = 'stylesheet';
          link.href = 'https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Orbitron:wght@500;600;700;800&display=swap';
          document.head.appendChild(link);
        }
      } catch (e) { /* sem armazenamento: tema padrão */ }
    })();
  </script>
</head>
<body>
  <div id="app" class="app">
    <aside id="sidebar" class="sidebar" aria-label="Barra lateral"></aside>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="btn-menu" aria-label="Abrir menu">
          <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg>
        </button>
        <div class="topbar-title" id="topbar-title"></div>
        <button class="search-btn" id="btn-search" aria-label="Buscar (Ctrl+K)">
          <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
          <span class="search-label">Buscar módulos, termos…</span>
          <kbd>Ctrl K</kbd>
        </button>
        <div class="py-status" id="py-status" title="Interpretador Python (Pyodide)">
          <span class="dot"></span><span class="label">Python</span>
        </div>
        <button class="icon-btn" id="btn-settings" aria-label="Configurações">
          <svg class="icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg>
        </button>
      </header>
      <main id="screen" class="screen"></main>
    </div>
  </div>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <!-- Editor de código (opcional: há fallback para textarea se o CDN falhar) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>

  <!-- Motor -->
  <script src="js/core/registry.js"></script>
  <script src="js/core/util.js"></script>
  <script src="js/core/markdown.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/theme.js"></script>
  <script src="js/core/sound.js"></script>
  <script src="js/core/scoring.js"></script>
  <script src="js/core/python-runner.js"></script>
  <script src="js/core/achievements.js"></script>
  <script src="js/core/selfcheck.js"></script>
  <script src="js/core/assistant.js"></script>
  <script src="js/ui/icons.js"></script>
  <script src="js/ui/character.js"></script>
  <script src="js/ui/dialog.js"></script>
  <script src="js/ui/editor.js"></script>
  <script src="js/ui/widgets.js"></script>
  <script src="js/ui/confetti.js"></script>
  <script src="js/ui/glossary.js"></script>
  <script src="js/ui/palette.js"></script>
  <script src="js/ui/ask-panel.js"></script>
  <script src="js/ui/shell.js"></script>
  <script src="js/steps/say.js"></script>
  <script src="js/steps/section.js"></script>
  <script src="js/steps/mcq.js"></script>
  <script src="js/steps/open.js"></script>
  <script src="js/steps/code.js"></script>
  <script src="js/steps/pytest.js"></script>
  <script src="js/steps/tdd.js"></script>
  <script src="js/steps/order.js"></script>
  <script src="js/steps/match.js"></script>
  <script src="js/steps/sql.js"></script>
  <script src="js/screens/home.js"></script>
  <script src="js/screens/track.js"></script>
  <script src="js/screens/session.js"></script>
  <script src="js/screens/results.js"></script>
  <script src="js/screens/glossary.js"></script>
  <script src="js/screens/achievements.js"></script>
  <script src="js/screens/review.js"></script>

  <!-- Lista de arquivos de conteúdo (trilhas, módulos, personagens) -->
  <script src="content/manifest.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
